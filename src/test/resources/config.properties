# Configuracion de la corrida. Cualquier valor se puede cambiar sin tocar este archivo
# pasando -Dclave=valor a Maven, por ejemplo: mvn test -Dnavegador.headless=true

# Sitio que se prueba
url=https://magenta-platypus-05cee2.netlify.app/
ambiente=Netlify (pruebas)

# Navegador: chrome o edge. headless=true corre sin abrir ventana
navegador=chrome
navegador.headless=false
# true deja la ventana abierta al terminar cada caso (solo para revisar a mano)
navegador.dejarAbierto=false

# Tiempos de espera en segundos
# corta: algo que debe aparecer rapido (un campo, un aviso)
# respuesta: lo que se le da al sitio para responder despues de enviar o guardar
# larga: tiempo maximo para encontrar un elemento o cargar una pagina
espera.corta=3
espera.respuesta=5
espera.larga=10

# Rutas de salida (relativas a la carpeta del proyecto)
carpeta.reportes=reportes de cada modulo
carpeta.logs=reportes de cada modulo/logs
# Archivo donde se lleva el numero de corrida (linea "Corridas: N")
archivo.corridas=lee_me.txt

# Datos que salen en la portada de los reportes Word
reporte.proyecto=Automatización de pruebas - Achron (software de gym)
reporte.autor=Jacobo Pérez
reporte.rol=Coach
